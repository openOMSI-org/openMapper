# Builds and tests openMapper on Linux for every push to main and every pull request, and checks
# that it still compiles on Windows. The packages for every system are built by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: Check partial Portuguese catalogues
        run: python3 tools/check-locales.py
      - run: cargo build --release --locked
      - run: cargo test --release --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --release --locked

  locale-preview-windows:
    # Pull request #12 test package for Portuguese screenshots.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: locale-preview-windows-x64
      - name: Check partial Portuguese catalogues
        run: python -X utf8 tools/check-locales.py
      - name: Package test build
        shell: pwsh
        run: ./tools/package-windows.ps1 -Target x86_64-pc-windows-msvc
      - name: Upload Windows x64 preview
        uses: actions/upload-artifact@v4
        with:
          name: openMapper-PR12-Windows-x64
          path: target/package/openMapper-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      MAX_BYTES: 1000000
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE"
      - name: No large files
        run: |
          status=0
          while IFS= read -r f; do
            size=$(stat -c %s "$f" 2>/dev/null || echo 0)
            if [ "$size" -ge "$MAX_BYTES" ]; then
              echo "::error file=$f::$f is $((size / 1024)) KB. Files of a megabyte or more do not go into the repository (see CONTRIBUTING.md)."
              status=1
            fi
          done < <(git diff --name-only --diff-filter=AM "$BASE" HEAD)
          exit $status
