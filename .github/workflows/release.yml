# Builds openMapper for Windows, macOS and Linux, each for x64 and ARM64, with the
# tools/package-* scripts. A tag v<version> publishes the packages as that release on GitHub, with
# the notes of that version from CHANGELOG.md; run by hand, the packages are only kept with the run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The builds only read the repository; `release` alone writes, with its own permission below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: The tag is the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - run: cargo test --release --locked

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            run: pwsh -File tools/package-windows.ps1 -Target x86_64-pc-windows-msvc
          # ARM64 (Snapdragon laptops): built on the x64 runner with its ARM64 tools
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            run: pwsh -File tools/package-windows.ps1 -Target aarch64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            run: sh tools/package-macos.sh aarch64-apple-darwin
          # Intel Macs: built on the Apple silicon runner
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            run: sh tools/package-macos.sh x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run: sh tools/package-linux.sh
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            run: sh tools/package-linux.sh
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: ${{ matrix.run }}
      - uses: actions/upload-artifact@v7
        with:
          name: openMapper-${{ matrix.name }}
          path: |
            target/package/*.zip
            target/package/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Notes and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no notes for $version in CHANGELOG.md"; exit 1; }
          (cd packages && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          ls -l packages
      - uses: softprops/action-gh-release@v3
        with:
          name: openMapper ${{ github.ref_name }}
          body_path: notes.md
          files: packages/*
          fail_on_unmatched_files: true
